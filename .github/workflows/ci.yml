name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff (lint)
        run: |
          ruff check .

      - name: Check formatting with Black
        run: |
          black --check .

      - name: Run tests (no DB / no integration)
        run: |
          pytest -m "not integration"
