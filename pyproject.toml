[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-pesitos"
version = "0.1.0"
description = "Telegram bot for tracking personal expenses and generating reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "locobit" }
]
dependencies = [
  "python-telegram-bot>=21,<22",
  "pendulum>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "reportlab>=4,<5",
  "sentry-sdk>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "black>=24,<25",
  "mypy>=1.11,<2",
  "alembic>=1.13,<2",
  "coverage[toml]>=7,<8",
]

[project.scripts]
pig-pesitos = "pig_pesitos.bot.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pig_pesitos*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["pig_pesitos"]
branch = true
omit = [
  "pig_pesitos/bot/*",
  "pig_pesitos/repositories/database.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
