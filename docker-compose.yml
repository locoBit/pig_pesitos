services:
  postgres:
    image: postgres:16
    container_name: pig-pesitos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pigpesitos
      POSTGRES_PASSWORD: pigpesitos
      POSTGRES_DB: pig_pesitos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigpesitos -d pig_pesitos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
